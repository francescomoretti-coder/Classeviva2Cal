name: ClasseViva Calendar Sync

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Create credentials.json
        run: |
          echo '$GOOGLE_CREDENTIALS' > credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Install dependencies
        run: bun install

      - name: Test diretto risposta ClasseViva
        env:
          CLASSEVIVA_USERNAME: ${{ secrets.CLASSEVIVA_USERNAME }}
          CLASSEVIVA_PASSWORD: ${{ secrets.CLASSEVIVA_PASSWORD }}
        run: |
          curl -i -X POST https://web.spaggiari.eu/rest/v1/auth/login/ \
            -H "Content-Type: application/json" \
            -H "User-Agent: cv_app_pdf" \
            -d "{\"ident\": null, \"pass\": \"$CLASSEVIVA_PASSWORD\", \"uid\": \"$CLASSEVIVA_USERNAME\"}"

      - name: Run sync script
        env:
          CLASSEVIVA_USERNAME: ${{ secrets.CLASSEVIVA_USERNAME }}
          CLASSEVIVA_PASSWORD: ${{ secrets.CLASSEVIVA_PASSWORD }}
        run: bun run index.ts
